<rect width="100%" height="100%" fill="#3e332f"/><text x="24" y="36" style="font-size:13px;opacity:.75">Holdings over time (synthetic data)</text><svg viewBox="0 0 672 308" width="672" height="308" class="sediment" role="img" aria-label="Holdings over time" aria-describedby="sediment-4-desc" overflow="visible" x="24" y="48"><desc id="sediment-4-desc">Small multiples, 3 panels: Praline Partners, Macaron Mills, Fudge Factory, each on its own scale. Jan to Jun. Praline Partners: latest $520m (Jun), low $470m (Mar), high $520m (Jun). Macaron Mills: latest $180m (Jun), low $120m (Jan), high $180m (Jun). Fudge Factory: latest $60m (Jun), low $58m (May), high $70m (Jan), no data for Apr.</desc><text x="670" y="11" text-anchor="end" class="dnote">each on its own scale</text><text x="56" y="38" class="dlabel">Praline Partners</text><line x1="50" x2="50" y1="102" y2="46" stroke="#edf3d7" stroke-width="1"></line><text x="44" y="106" text-anchor="end">$470m</text><text x="44" y="50" text-anchor="end">$520m</text><path d="M56.0 90.8 L163.6 68.4 L260.7 102.0 L368.3 57.2 L472.4 51.6 L580.0 46.0" fill="none" stroke="#edf3d7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></path><circle cx="580" cy="46" r="2.5" fill="#edf3d7" stroke="#3e332f" stroke-width="1.5"></circle><text x="588" y="50" class="dvalue">$520m</text><text x="56" y="124" class="dlabel">Macaron Mills</text><line x1="50" x2="50" y1="188" y2="132" stroke="#edf3d7" stroke-width="1"></line><text x="44" y="192" text-anchor="end">$120m</text><text x="44" y="136" text-anchor="end">$180m</text><path d="M56.0 188.0 L163.6 169.3 L260.7 141.3 L368.3 160.0 L472.4 136.7 L580.0 132.0" fill="none" stroke="#edf3d7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></path><circle cx="580" cy="132" r="2.5" fill="#edf3d7" stroke="#3e332f" stroke-width="1.5"></circle><text x="588" y="136" class="dvalue">$180m</text><text x="56" y="210" class="dlabel">Fudge Factory</text><line x1="50" x2="50" y1="274" y2="218" stroke="#edf3d7" stroke-width="1"></line><text x="44" y="278" text-anchor="end">$58m</text><text x="44" y="222" text-anchor="end">$70m</text><path d="M56.0 218.0 L163.6 236.7 L260.7 260.0 M472.4 274.0 L580.0 264.7" fill="none" stroke="#edf3d7" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"></path><circle cx="580" cy="264.6666666666667" r="2.5" fill="#edf3d7" stroke="#3e332f" stroke-width="1.5"></circle><text x="588" y="268.6666666666667" class="dvalue">$60m</text><line x1="56" x2="580" y1="282" y2="282" stroke="#edf3d7" stroke-width="1"></line><text x="56" y="300" text-anchor="start">Jan</text><text x="212.15894039735102" y="300" text-anchor="middle">Mar</text><text x="319.73509933774835" y="300" text-anchor="middle">Apr</text><text x="423.841059602649" y="300" text-anchor="middle">May</text><text x="531.4172185430464" y="300" text-anchor="middle">Jun</text></svg></svg>

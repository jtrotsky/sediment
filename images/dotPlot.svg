<rect width="100%" height="100%" fill="#3e332f"/><text x="24" y="36" style="font-size:13px;opacity:.75">Risk profile (synthetic data)</text><svg viewBox="0 0 672 172" width="672" height="172" class="sediment" role="img" aria-label="Risk profile" aria-describedby="sediment-1-desc" tabindex="0" overflow="visible" x="24" y="48"><desc id="sediment-1-desc">Dot plot, 5 rows on a scale from cash to aggressive. Cocoa Cash: cash, $24m. Marzipan Bonds: conservative, $60m. Nougat Balanced: balanced, $300m. Pistachio Growth: growth, $140m. Ghost Pepper: aggressive, $40m. Marker line: between balanced and growth. Arrow keys step through the values. Home and End jump to the ends. Escape closes.</desc><line x1="384.38652482269504" x2="384.38652482269504" y1="8" y2="136" stroke="#edf3d7" stroke-width="1.5" stroke-opacity="0.6"></line><line x1="131" x2="592" y1="24" y2="24" stroke="rgba(237,243,215,0.5)" stroke-dasharray="1 4" stroke-opacity="0.5"></line><text x="0" class="dlabel" y="28">Cocoa Cash</text><text x="672" y="28" text-anchor="end" class="dvalue">$24m</text><circle cx="131" cy="24" r="3" fill="#edf3d7" fill-opacity="0.85"></circle><line x1="131" x2="592" y1="48" y2="48" stroke="rgba(237,243,215,0.5)" stroke-dasharray="1 4" stroke-opacity="0.5"></line><text x="0" class="dlabel" y="52">Marzipan Bonds</text><text x="672" y="52" text-anchor="end" class="dvalue">$60m</text><circle cx="246.25" cy="48" r="4.024922359499621" fill="#edf3d7" fill-opacity="0.85"></circle><line x1="131" x2="592" y1="72" y2="72" stroke="rgba(237,243,215,0.5)" stroke-dasharray="1 4" stroke-opacity="0.5"></line><text x="0" class="dlabel" y="76">Nougat Balanced</text><text x="672" y="76" text-anchor="end" class="dvalue">$300m</text><circle cx="361.5" cy="72" r="9" fill="#edf3d7" fill-opacity="0.85"></circle><line x1="131" x2="592" y1="96" y2="96" stroke="rgba(237,243,215,0.5)" stroke-dasharray="1 4" stroke-opacity="0.5"></line><text x="0" class="dlabel" y="100">Pistachio Growth</text><text x="672" y="100" text-anchor="end" class="dvalue">$140m</text><circle cx="476.75" cy="96" r="6.148170459575758" fill="#edf3d7" fill-opacity="0.85"></circle><line x1="131" x2="592" y1="120" y2="120" stroke="rgba(237,243,215,0.5)" stroke-dasharray="1 4" stroke-opacity="0.5"></line><text x="0" class="dlabel" y="124">Ghost Pepper</text><text x="672" y="124" text-anchor="end" class="dvalue">$40m</text><circle cx="592" cy="120" r="3.2863353450309964" fill="#edf3d7" fill-opacity="0.85"></circle><line x1="131" x2="592" y1="136" y2="136" stroke="rgba(237,243,215,0.5)"></line><line x1="131" x2="131" y1="136" y2="139" stroke="rgba(237,243,215,0.5)"></line><text x="131" y="150" text-anchor="middle">cash</text><line x1="246.25" x2="246.25" y1="136" y2="139" stroke="rgba(237,243,215,0.5)"></line><text x="246.25" y="150" text-anchor="middle">conservative</text><line x1="361.5" x2="361.5" y1="136" y2="139" stroke="rgba(237,243,215,0.5)"></line><text x="361.5" y="150" text-anchor="middle">balanced</text><line x1="476.75" x2="476.75" y1="136" y2="139" stroke="rgba(237,243,215,0.5)"></line><text x="476.75" y="150" text-anchor="middle">growth</text><line x1="592" x2="592" y1="136" y2="139" stroke="rgba(237,243,215,0.5)"></line><text x="592" y="150" text-anchor="middle">aggressive</text><g class="sfocus" pointer-events="none" visibility="hidden"><rect fill="none" stroke="currentColor" stroke-width="1.5" rx="3"></rect></g></svg></svg>
